<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elisandro Sams</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/9169ad0fbb.js" crossorigin="anonymous"></script>
</head>
<body>
   <section id="aboutme">
    <nav>
        <div class="personal__logo">Elisandro Sams</div>
        <ul class="nav__link--list">
            <li>
                <a href="" class="
                    nav__link--anchor
                    link__hover-effect
                    link__hover-effect--black"
                    >Programming</a>
            </li>
            <li>
                <a href="" class="
                    nav__link--anchor
                    link__hover-effect
                    link__hover-effect--black"
                    >Projects</a>
            </li>
            <li>
                <a href="" class="
                    nav__link--anchor
                    nav__link--anchor--primary"
                    >Contact</a>
            </li>
        </ul>
    </nav>
    <div class="flex flex-1">
        <div class="about-me__info row">
            <div class="about-me__info--container">
                <figure class="about-me__picture--mask">
                    <img src="assets/profile picture.jpg" class="about-me__picture" alt="profile picture">
                </figure>
                <h1 class="about-me__info--title">
                    Hey! I'm <span class="text--green">Elisandro Sams</span>
                </h1>
                <p class="about-me__info--para">I'm a passionate <Strong class="text--green">Software Engineer</Strong> with experience in creating dynamic web applications and designs.</p>
                <div class="about-me__links">
                    <a href="" class="about-me__link">
                        <i class="fa-solid fa-envelope"></i>
                    </a>
                    <a href="" class="about-me__link">
                        <i class="fa-brands fa-github"></i>
                    </a>
                    <a href="" class="about-me__link">
                        <i class="fa-brands fa-linkedin"></i>
                    </a>
                </div>
            </div>
            <figure class="about-me__img--container">
                <img src="assets/pixel beetlefix.jpg" class="about-me__img" alt="Beetle picture">
            </figure>
        </div>
    </div>
   </section>
   <section id="Languages">
    <div class='container'>
        <div class="row">
            <h1 class="section__title">This is my <strong class="text--green">Technology Stack</strong></h1>
            <div class="language__list">
                <div class="language">
                    <figure calss="language__img--wrapper">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/3/38/HTML5_Badge.svg" alt="HTML5 logo" class="language__img">
                    </figure>
                    <span class="language__name">HTML5</span>
                </div>
                <div class="language">
                    <figure calss="language__img--wrapper">
                        <img src=https://cdn.iconscout.com/icon/free/png-256/css-131-722685.png alt="CSS logo" class="language__img">
                    </figure>
                    <span class="language__name">CSS3</span>
                </div>
                <div class="language">
                    <figure calss="language__img--wrapper">
                        <img src="https://cdn.iconscout.com/icon/free/png-256/javascript-1-225993.png" alt="JavaScript logo" class="language__img">
                    </figure>
                    <span class="language__name">JavaScript</span>
                </div>
                <div class="language">
                    <figure calss="language__img--wrapper">
                        <img src="https://toppng.com/uploads/preview/python-logo-11609373642q9ewsev5ea.png" alt="Python logo" class="language__img">
                    </figure>
                    <span class="language__name">Python</span>
                </div>
                <div class="language">
                    <figure calss="language__img--wrapper">
                        <img src="https://blitzhandel24.imgbolt.de/media/image/fb/45/e4/Affinity_Designer_2-logo-svg-1.png" alt="Affinity Designer logo" class="language__img">
                    </figure>
                    <span class="language__name">Affinity Designer</span>
                </div>
            </div>
         </div>
    </div>
   </section>
</body>
</html>
